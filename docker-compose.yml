services:
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-123}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-123}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - backend

  redis-cache:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - backend

  redis-queue:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - backend

  frappe:
    image: frappe/bench:latest
    restart: unless-stopped
    working_dir: /workspace/bench
    command: sleep infinity
    depends_on:
      - mariadb
      - redis-cache
      - redis-queue
    volumes:
      - bench-data:/workspace/bench
      - .:/workspace/erpnext-source:cached
    networks:
      - backend
      - edge

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frappe
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge

volumes:
  mariadb-data:
  bench-data:

networks:
  backend:
    internal: true
  edge:

services:
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-123}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-123}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - backend

  redis-cache:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-queue:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  frappe:
    build:
      context: .
      dockerfile: Dockerfile.cephlon
    image: cephlon/erpnext:dev
    restart: unless-stopped
    user: frappe
    working_dir: /workspace/bench
    command: bash -lc "/workspace/erpnext-source/frappe-start.sh"
    depends_on:
      - mariadb
      - redis-cache
      - redis-queue
    volumes:
      - bench-data:/workspace/bench
      - .:/workspace/erpnext-source:cached
    networks:
      - backend
      - edge
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frappe
    ports:
      - "${HTTP_PORT:-3011}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  mariadb-data:
  bench-data:

networks:
  backend:
    internal: true
  edge:
